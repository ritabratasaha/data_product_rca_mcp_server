  <text x="140" y="270" text-anchor="middle" fill="#3730A3" font-size="11" font-weight="500">Custom Agents</text>
  
  <rect x="65" y="295" width="150" height="40" rx="6" fill="#fff" stroke="#C7D2FE" stroke-width="1"/>
  <text x="140" y="320" text-anchor="middle" fill="#3730A3" font-size="11" font-weight="500">MCP Evals</text>
  
