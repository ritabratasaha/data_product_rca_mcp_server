name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          TESTING: "1"
        run: |
          pytest -v --tb=short

  evals:
    runs-on: ubuntu-latest
    needs: test  # Run after unit tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Start server in background
        run: |
          rca-server &
          sleep 5  # Wait for server startup
        env:
          TESTING: "true"

      - name: Run MCP evals
        run: mcpevals run evals/ --json-output eval-reports/results.json || true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Check eval pass rate (must be >= 85%)
        run: |
          python -c "
          import json
          import sys

          with open('eval-reports/results.json') as f:
              results = json.load(f)

          total = results.get('total_tests', 0)
          passed = results.get('passed_tests', 0)

          if total == 0:
              print('ERROR: No tests found')
              sys.exit(1)

          pass_rate = (passed / total) * 100
          print(f'Pass rate: {passed}/{total} ({pass_rate:.1f}%)')

          if pass_rate < 85:
              print(f'FAILED: Pass rate {pass_rate:.1f}% is below 85% threshold')
              sys.exit(1)
          else:
              print(f'PASSED: Pass rate meets 85% threshold')
          "

      - name: Upload eval reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval-reports/

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rca-server
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
